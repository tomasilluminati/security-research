<svg xmlns="http://www.w3.org/2000/svg" width="480" height="252" viewBox="0 0 480 252" role="img" aria-labelledby="title desc">
  <title id="title">Two names, one file</title>
  <desc id="desc">The program compares collision_ss and collision_ß as two different strings, while the APFS volume resolves both names to one directory entry.</desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8293A8"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="479" height="251" rx="9.5" fill="#131B29" stroke="#303C4D"/>
  <text x="24" y="34" fill="#9AABBE" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.9">THE PROGRAM COMPARES</text>
  <text x="304" y="34" fill="#9AABBE" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.9">THE VOLUME HAS</text>
  <rect x="24.5" y="50.5" width="196" height="46" rx="6" fill="#1B2536" stroke="#3A475A"/>
  <text x="122" y="79" text-anchor="middle" fill="#E9EDF3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17">collision_ss</text>
  <rect x="24.5" y="150.5" width="196" height="46" rx="6" fill="#1B2536" stroke="#3A475A"/>
  <text x="122" y="179" text-anchor="middle" fill="#E9EDF3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="17">collision_ß</text>
  <text x="122" y="129" text-anchor="middle" fill="#D08A68" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700">two different strings</text>
  <rect x="304.5" y="50.5" width="152" height="146" rx="6" fill="#1B2536" stroke="#D08A68"/>
  <text x="380" y="119" text-anchor="middle" fill="#E9EDF3" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">one file</text>
  <text x="380" y="142" text-anchor="middle" fill="#9AABBE" font-family="Arial, Helvetica, sans-serif" font-size="12.5">one directory entry</text>
  <path d="M221 74L300 104" stroke="#8293A8" stroke-width="1.5" fill="none" marker-end="url(#tip)"/>
  <path d="M221 174L300 144" stroke="#8293A8" stroke-width="1.5" fill="none" marker-end="url(#tip)"/>
  <text x="24" y="229" fill="#9AABBE" font-family="Arial, Helvetica, sans-serif" font-size="13">APFS folds ß to ss, so either name opens the same file.</text>
</svg>
